[package]
name = "shkilni-dzvinky"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Шкільні дзвінки за розкладом з інтеграцією API повітряної тривоги"
license = "GPL-3.0-or-later"
repository = "https://github.com/pachdomenic/Pererva"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
rodio = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = "1.18.1"
sys-locale = "0.3.2"
toml = "1.1.8"
ureq = "3.4.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
slint-build = "1.18.1"
