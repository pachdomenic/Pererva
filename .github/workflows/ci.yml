name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Форматування, clippy і тести
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Системні залежності
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build:
    name: Збірка (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Системні залежності
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: shkilni-dzvinky-${{ runner.os }}
          path: |
            target/release/shkilni-dzvinky
            target/release/shkilni-dzvinky.exe
          if-no-files-found: error
